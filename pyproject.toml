[project]
name = "qost-twin"
version = "0.1.0"
description = "Qost Twin: digital twin of a car plant (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "twin-core",
    "qost-sim",
    "qost-collector",
    "qost-engine",
    "qost-api",
    "qost-notifier",
    "qost-ml",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/twin_core",
    "services/sim",
    "services/collector",
    "services/engine",
    "services/api",
    "services/notifier",
    "ml",
]

[tool.uv.sources]
twin-core = { workspace = true }
qost-sim = { workspace = true }
qost-collector = { workspace = true }
qost-engine = { workspace = true }
qost-api = { workspace = true }
qost-notifier = { workspace = true }
qost-ml = { workspace = true }

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "tools", "web", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "DTZ", "TID", "C4", "PIE", "RET",
]
# Cyrillic UI strings and aliases are legitimate in this project.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# NFR-11: "now" comes only from twin_core.clock.Clock.
"datetime.datetime.now".msg = "use twin_core.clock.Clock.now() (NFR-11)"
"datetime.datetime.utcnow".msg = "use twin_core.clock.Clock.now() (NFR-11)"
"datetime.datetime.today".msg = "use twin_core.clock.Clock.now() (NFR-11)"
"datetime.date.today".msg = "use twin_core.clock.Clock.now() (NFR-11)"
"time.time".msg = "use twin_core.clock.Clock.now() (NFR-11)"
"time.time_ns".msg = "use twin_core.clock.Clock.now() (NFR-11)"

[tool.ruff.lint.per-file-ignores]
"packages/twin_core/src/twin_core/clock.py" = ["TID251"]
# pydantic copies mutable defaults per instance; ruff cannot see the BaseModel base across modules.
"packages/twin_core/src/twin_core/config/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
    "support",
    "twin_core", "qost_sim", "qost_collector", "qost_engine", "qost_api", "qost_notifier", "qost_ml",
]

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/twin_core/src",
    "services/sim/src",
    "services/collector/src",
    "services/engine/src",
    "services/api/src",
    "services/api/migrations/env.py",
    "services/notifier/src",
    "ml/src",
    "tests",
]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs running infrastructure (make up); excluded from make check",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
