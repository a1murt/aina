[project]
name = "qost-ml"
version = "0.1.0"
description = "Aina ML: PdM dataset, training, evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5",
    "numpy>=2.0",
    "polars>=1.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "twin-core",
]

[project.scripts]
qost-ml = "qost_ml.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
