# Eclipse Mosquitto 2 — MQTT Unified Namespace broker for Qost Twin (SPEC §6.8).
# Demo / on-prem default: anonymous access on the compose network. For a pilot enable
# password_file / TLS (NFR-04) — the collector only subscribes (read-only).
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
