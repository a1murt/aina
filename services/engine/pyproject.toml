[project]
name = "qost-engine"
version = "0.1.0"
description = "Qost Twin stream engine (states, downtime, KPI, rules)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "twin-core",
]

[project.scripts]
qost-engine = "qost_engine.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
