[project]
name = "qost-collector"
version = "0.1.0"
description = "Aina collector (OPC UA / MQTT, read-only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.3",
    "asyncua>=1.1.5",
    "twin-core",
]

[project.scripts]
qost-collector = "qost_collector.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
