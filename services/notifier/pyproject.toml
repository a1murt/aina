[project]
name = "qost-notifier"
version = "0.1.0"
description = "Qost Twin Telegram notifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31,<4",
    # aiogram's own HTTP client, used directly for the API ack call (no extra package)
    "aiohttp>=3.9",
    "twin-core",
]

[project.scripts]
qost-notifier = "qost_notifier.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
