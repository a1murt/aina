[project]
name = "qost-sim"
version = "0.1.0"
description = "Qost Twin virtual plant (SimPy, OPC UA, MQTT)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.3",
    "asyncua>=1.1.5",
    "fastapi>=0.115",
    "polars>=1.10",
    "simpy>=4.1",
    "twin-core",
    "uvicorn>=0.32",
]

[project.scripts]
qost-sim = "qost_sim.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
