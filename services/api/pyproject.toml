[project]
name = "qost-api"
version = "0.1.0"
description = "Qost Twin REST + WebSocket API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "twin-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx2>=2.13.1",
    "redis>=5.2",
]

[project.scripts]
qost-api = "qost_api.__main__:main"

[tool.uv.sources]
twin-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
