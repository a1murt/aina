# Alembic configuration for the Aina database (TimescaleDB on PostgreSQL 16, SPEC §8).
# The connection URL comes from the DATABASE_URL environment variable (see migrations/env.py).
#   uv run --package qost-api alembic -c services/api/alembic.ini upgrade head   (or: make migrate)

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
